# Auslieferung als Container. Baut das Image je Architektur nativ (ohne QEMU),
# schiebt Kandidaten je Architektur, führt sie zu einem Multi-Arch-Manifest
# zusammen, signiert es schlüssellos mit cosign und hängt eine SBOM an.
#
# Gebaut wird aus dem Dockerfile im Wurzelverzeichnis: ein zweistufiger
# Go-Bau (golang:1.21-alpine), der das Binärprogramm mit go:embed erzeugt,
# ausgeliefert auf gcr.io/distroless/static-debian12:nonroot als Nutzer
# nonroot. Das ist NICHT mehr die frühere nginx:alpine-Auslieferung des
# unveränderten Quellverzeichnisses — der Go-Umbau hat das Dockerfile
# ersetzt, dieser Kommentar war stehen geblieben. Was von der alten
# Beschreibung noch gilt: die Basis-URLs der Fachdienste kommen weiterhin
# zur Laufzeit aus der Umgebung, nicht aus dem Image — dasselbe Image läuft
# gegen Produktion und gegen eine Testumgebung.
#
# Die Action-Pins stehen hier als Commit-SHA, nicht als Tag: dieser Workflow
# hält ein Registry-Token und eine Signierungsidentität, und ein Tag lässt
# sich verschieben. Die übrigen Workflows pinnen bewusst per Tag (siehe
# .github/zizmor.yml) — dort hält keiner ein vergleichbares Recht, sodass
# Dependabots automatische Aktualisierung den Mehraufwand eines SHA-Pins
# nicht rechtfertigt.
name: Docker Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

# Die implizite Shell von GitHub ist `bash -e`, ohne pipefail: ein Fehler
# mitten in einer Pipeline wird als Erfolg des letzten Glieds gemeldet.
defaults:
  run:
    shell: bash

jobs:
  # Bei einem Tag-Push liefern die semver-Muster unten die Tags. Ein
  # Lauf per workflow_dispatch startet dagegen von einem Branch, wo kein
  # semver-Tag greift — dafür wird die Version aus package.json gelesen.
  version:
    name: Version bestimmen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: v
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

  # Ein Image, das baut, aber nicht antwortet, ist keine Auslieferung. Geprüft
  # wird mit demselben Ziel wie lokal (make docker-test → e2e/container.sh):
  # Konfiguration aus der Umgebung, CSP-Kopf mit den konfigurierten Diensten,
  # kein Caching der HTML-Seite, Prozess nicht als root.
  #
  # Der Test läuft auf amd64. Für arm64 gibt es keinen eigenen Durchlauf —
  # geprüft ist damit das Rezept, nicht jedes Manifest der Veröffentlichung.
  verify:
    name: Container prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: make docker-test

  # Die Kandidaten-Tags je Architektur tragen die Lauf-ID. Ohne sie würden
  # zwei gleichzeitige Releases dieselben `ci-amd64`/`ci-arm64`-Tags
  # schreiben — die concurrency-Gruppe ist nach ref geschlüsselt und
  # verhindert das nicht — und ein Lauf könnte die Architektur des anderen
  # in ein Manifest mischen, das zwei Commits unter einem Tag vereint.
  build:
    name: Bauen (${{ matrix.arch }})
    needs: [version, verify]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: An der Registry anmelden
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Kandidat je Architektur bauen und schieben
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ github.run_id }}-${{ matrix.arch }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

  merge:
    name: Zusammenführen und signieren
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # schlüssellose Signatur über das OIDC-Token
      attestations: write  # Provenance und SBOM am zusammengeführten Index
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: An der Registry anmelden
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags ermitteln
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` hängt am Tag-Ref, nicht an is_default_branch: ein
          # Tag-Push läuft nicht auf dem Default-Branch, sodass die
          # gewohnte Bedingung hier nie zutreffen und nie ein `latest`
          # entstehen würde — und veröffentlicht wird ausschließlich aus
          # Tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Die Tag-Liste kommt über die Umgebung, nicht per Interpolation in das
      # Skript: metadata-action gibt eine Zeile je Tag aus, und ein direkt
      # eingesetzter Wert ist sowohl ein Quoting-Risiko als auch unlesbar.
      # Gelesen wird mit einem Here-String statt einer Pipe, damit die Schleife
      # in DIESER Shell läuft — bei `printf | while` liegt der Rumpf in einer
      # Subshell, ein fehlgeschlagenes imagetools create würde als Erfolg von
      # printf gemeldet, und ein unvollständiges Manifest würde signiert.
      - name: Kandidaten zu einem Manifest zusammenführen
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          RUN_ID: ${{ github.run_id }}
        run: |
          src="${REGISTRY}/${IMAGE_NAME}:ci-${RUN_ID}"
          while read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create -t "$tag" \
              "${src}-amd64" "${src}-arm64"
          done <<< "$TAGS"

      # Jeder Release-Tag zeigt auf den einen Index, den imagetools gerade
      # erzeugt hat; sein Digest wird einmal genommen, und alles Weitere
      # bezeugt GENAU DEN. Die Kandidaten je Architektur tragen zwar
      # Provenance und SBOM, aber `imagetools create` erzeugt einen NEUEN
      # Index mit neuem Digest, und Bezeugungen folgen keinem Digest, für den
      # sie nicht ausgestellt wurden.
      - name: Veröffentlichten Digest auflösen
        id: digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          first=$(head -n1 <<< "$TAGS")
          digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [ -n "$digest" ] || { echo "::error::Index-Digest konnte nicht aufgelöst werden"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Manifest signieren
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Provenance für den Index bezeugen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: SBOM des Index erzeugen
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: SBOM für den Index bezeugen
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      # Beide Werte gehen über die Umgebung. VERSION stammt aus package.json,
      # also aus Repository-Inhalt: direkt in das Skript eingesetzt würde bash
      # auswerten, was dort steht — ein `$(…)` in der Datei liefe auf dem
      # Release-Runner, der ein Registry-Token und eine Signierungsidentität
      # hält. actionlint meldet das nicht, es hält `needs.*.outputs` für
      # vertrauenswürdig.
      - name: Zusammenfassung
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          {
            echo "### Veröffentlicht"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Digest: ${DIGEST}"
            echo
            echo "Schlüssellos mit cosign signiert. SLSA-Provenance und eine SPDX-SBOM"
            echo "sind gegen DIESEN Digest bezeugt — den zusammengeführten Multi-Arch-"
            echo "Index, nicht die Kandidaten je Architektur, deren Digests abweichen."
            echo
            echo "Prüfen:"
            echo '```'
            echo "cosign verify ${REGISTRY}/${IMAGE_NAME}:${VERSION} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${IMAGE_NAME}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://${REGISTRY}/${IMAGE_NAME}:${VERSION} -R ${IMAGE_NAME}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
