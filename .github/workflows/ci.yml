name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Das Skill-Submodul liegt in einem PRIVATEN Repository und wird NUR für
      # den a11y-grep-Schritt ganz unten gebraucht — Go-Tests, gofmt und
      # `make test` kommen ohne es aus. Der Checkout selbst holt das Submodul
      # deshalb hier nicht mehr mit (submodules: false s. u.); es wird erst
      # gezielt nachgeladen, WENN ein Token verfügbar ist.
      #
      # Der voreingestellte GITHUB_TOKEN gilt nur für DIESES Repository,
      # weshalb ein Submodul-Checkout des privaten claude-skills mit "not
      # found" abbräche — GitHub meldet fehlenden Zugriff als 404, nicht als
      # 403. Die SSH-URL aus .gitmodules hilft nicht: der Runner hat keinen
      # Schlüssel, checkout bildet SSH ohnehin auf HTTPS mit Token ab.
      #
      # Deshalb ein Installations-Token der Release-App, ausdrücklich für BEIDE
      # Repositories — ein App-Token ist sonst auf dieses eine beschränkt und
      # der Klon scheitert weiter. Mehr als Contents: read braucht der Klon
      # nicht.
      #
      # continue-on-error: GitHub gibt einem von Dependabot ausgelösten Lauf
      # aus Sicherheitsgründen KEINEN Zugriff auf Repository-Secrets (auch
      # nicht bei einem pull_request-Trigger im eigenen Repository, nicht nur
      # bei Forks) — client-id/private-key sind dann leer, und dieser Schritt
      # schlägt fehl. Früher stand hier die Behauptung, dieser Fall beträfe
      # nur PRs aus Forks und käme hier nicht vor; das stimmt seit Dependabot
      # läuft nicht mehr. Ohne continue-on-error risse der fehlende Token den
      # kompletten Job mit herunter, obwohl nur EIN Schritt (a11y-grep) ihn
      # wirklich braucht.
      - name: Installations-Token der App erzeugen (falls Secrets verfügbar)
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            expertus
            claude-skills
          permission-contents: read

      - uses: actions/checkout@v4
        with:
          submodules: false  # das Submodul wird gezielt im nächsten Schritt geladen

      # Nur wenn der Token oben tatsächlich entstanden ist. `git submodule
      # update --init` statt eines erneuten vollständigen Checkouts, damit
      # der bereits ausgecheckte Hauptbaum erhalten bleibt.
      - name: Skill-Submodul laden (falls Token verfügbar)
        id: submodule
        if: steps.app-token.outcome == 'success'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config submodule.third_party/claude-skills.url \
            "https://x-access-token:${TOKEN}@github.com/jobrunner/claude-skills.git"
          git submodule update --init
          echo "loaded=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go-Tests
        run: go test ./... -v
      - name: Go-Formatierung
        run: test -z "$(gofmt -l .)"
      # Über make statt direkt node --test: so gibt es nur eine Definition
      # der Testsuite (das Makefile-Ziel), lokal und in der CI identisch —
      # ein direkter Aufruf war zuvor auseinandergelaufen (154 statt 151).
      - run: make test
      # Layer 1 des A11y-Harness braucht ripgrep und kein Netz.
      - run: sudo apt-get install -y ripgrep
      - name: A11y-Grep (Layer 1)
        if: steps.submodule.outputs.loaded == 'true'
        run: .claude/skills/web-accessibility-audit/scripts/a11y-grep.sh --all . --strict
      # Sichtbarer Hinweis statt eines stillschweigend grünen, aber
      # übersprungenen Schritts: wer das Protokoll überfliegt, soll sehen,
      # dass diese Prüfung NICHT gelaufen ist, nicht bestanden hat.
      - name: Hinweis, falls A11y-Grep übersprungen wurde
        if: steps.submodule.outputs.loaded != 'true'
        run: echo "::warning::A11y-Grep (Layer 1) wurde NICHT ausgeführt — das private Skill-Submodul third_party/claude-skills war nicht erreichbar (kein Secret-Zugriff in diesem Lauf, z. B. bei einem von Dependabot ausgelösten PR). Das ist kein bestandener Lauf dieser Prüfung, sondern ihr Ausfall."

  browser:
    runs-on: ubuntu-latest
    steps:
      # Anders als der test-Job braucht dieser hier das private Skill-
      # Submodul GAR NICHT — `make e2e` ruft nur Playwright gegen e2e/ auf,
      # nichts davon liest third_party/claude-skills. Ein einfacher Checkout
      # ohne Submodule genügt deshalb und braucht keinen App-Token; das hielt
      # diesen Job früher unnötig von Dependabot-PRs abhängig, obwohl er das
      # Submodul nie verwendet hat.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Die Oberflächentests laufen gegen Stubs, nicht gegen die echten
      # Dienste — deshalb sind sie hier zulässig. Über make e2e statt
      # direkt npx: dasselbe Ziel wie lokal, eine Definition.
      - run: make e2e

  # Das Image bei jedem Push prüfen, nicht erst beim Release: geprüft wird mit
  # demselben Ziel wie lokal (make docker-test → e2e/container.sh), damit es
  # nur eine Definition der Containerprüfung gibt. Ein Image, das baut, aber
  # nicht antwortet, ist kein grüner Build.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make docker-test

  docker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  # actionlint findet Fehler in den Workflows und Script-Injection über
  # unvertraute github.event-Felder.
  actions-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # -shellcheck erwartet den PFAD ZUR AUSFÜHRBAREN DATEI, keine
      # shellcheck-Optionen: steht dort etwas anderes, überspringt actionlint
      # shellcheck stillschweigend und der Job meldet Erfolg, obwohl er nur
      # die Hälfte geprüft hat.
      - run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash \
            | bash -s -- 1.7.7
          ./actionlint -color -shellcheck=shellcheck
