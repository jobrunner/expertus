server {
    listen ${NGINX_PORT};
    server_name _;
    root /usr/share/nginx/html;

    # connect-src wird aus denselben Variablen gebaut wie config.json.
    # Stünde hier eine feste Liste, blockierte die Richtlinie genau die
    # Dienste, die man gerade konfiguriert hat.
    #
    # nginx vererbt add_header nicht an einen location-Block, der selbst
    # welche setzt — deshalb stehen die drei Kopfzeilen hier in einer
    # eigenen Variablen und werden in jedem location-Block wiederholt.
    set $csp "default-src 'self'; connect-src 'self' ${ORTUS_BASE_URL} ${HABITATUS_BASE_URL} ${HOSTUS_BASE_URL}; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

    # Ohne Build gibt es keine Hashes in Dateinamen — immutable wäre falsch.
    location = /index.html {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
    }
    location = /config.json {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
    }
    location ~* \.(js|css)$ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        etag on;
    }

    location / {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
